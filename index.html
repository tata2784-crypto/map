<script>
const DATA = {"stations": [{"idx": "I", "name": "Казанский вокзал · Москва", "msg": "Стартуем с Казанского — единственного московского вокзала в неорусском стиле. Строили его почти 30 лет: открыли в 1913-м, завершили в 1940-м. Автор — Алексей Щусев: 73-метровая башня стилизована под Сююмбике Казанского кремля, шпиль венчает Зилант — крылатый змей, символ Казани. Красота в детали: казанская Сююмбике наклонена почти на два метра и числится среди «падающих башен» мира, а московская копия стоит идеально ровно — Казань встречает нас в Москве в своём лучшем виде.", "bridge": "Едем в город, который до 1778 года носил совсем другое имя."}, {"idx": "II", "name": "Рязань-2", "msg": "Станция носит имя города на Оке, а город до 1778 года назывался Переяславль-Рязанский — нынешняя Рязань ведёт родословную от столицы древнего княжества. А вот знаменитые земляки родились не в самом городе, а на рязанской земле: Сергей Есенин — в селе Константиново, Константин Циолковский — в селе Ижевское. В городе также один из крупнейших в стране музеев Воздушно-десантных войск. И ещё: Рязань-2 — бывшая станция Рязанско-Уральской дороги, одной из крупнейших частных магистралей империи; её владелец Павел фон Дервиз построил первый участок за рекордный год.", "bridge": "Дальше — город, которому суда были нужнее дорог."}, {"idx": "III", "name": "Ряжск-1", "msg": "Станция обслуживает город, известный с 1502 года: Иван III в грамоте о маршруте турецкого посла упомянул эти места как Рясское поле. Ряжск вырос из сторожевого пункта на волоке, где суда перетаскивали между бассейнами Оки и Дона, и в XVI–XVII веках был частью Большой Засечной черты. А в XIX веке стал железнодорожным узлом на пересечении Рязанско-Уральской и Сызрано-Вяземской дорог — и эту важную роль играет до сих пор.", "bridge": "Следующая станция — пример того, как церковное имя становится географическим."}, {"idx": "IV", "name": "Александро-Невская", "msg": "До 1890 года эта станция называлась Раненбургской — хотя сам Раненбург стоит в 29 верстах. Современное имя станция получила в честь близлежащей церкви Александра Невского, а рядом с вокзалом вырос посёлок, который ныне — районный центр Александро-Невский. Классическая история: сначала вокзал, потом вокруг него — жизнь.", "bridge": "А теперь — станция с самым торжественным названием на всём маршруте."}, {"idx": "V", "name": "Богоявленск", "msg": "Богоявление — один из древнейших праздников христианского календаря, и звучит название соответственно торжественно. В XIX веке Богоявленск был важным узлом Рязанско-Уральской дороги: здесь встречалась линия Рязань — Козлов с веткой, шедшей на Павелец. Полтора века прошло, а назначение места не изменилось — встречать поезда.", "bridge": "Едем в город, где наука буквально растёт в садах."}, {"idx": "VI", "name": "Мичуринск-Воронежский", "msg": "Станция носит имя города, а город до 1932 года назывался Козлов и получил новое имя ещё при жизни Ивана Мичурина — знаменитого селекционера без высшего образования, по распространённым оценкам выведшего более 300 сортов плодовых культур. Сегодня Мичуринск — наукоград аграрного профиля, единственный такой в России. Здание нашего вокзала, кстати, — памятник архитектуры.", "bridge": "Осталось место, чьё название обманчиво, а история — совершенно серьёзная."}, {"idx": "VII", "name": "Грязи-Воронежские", "msg": "Станция получила имя от стоявшего рядом села Грязи — и село, и посёлок при вокзале выросли с нуля в 1868 году, когда здесь прошла линия Козлов—Воронеж. Уже через год отсюда провели ветки на Елец и Борисоглебск — так Грязи стали узлом, куда сходятся направления на четыре стороны света. В декабре 1941-го это был прифронтовой узел: станцию бомбили, но эшелоны шли — в том числе в дни Елецкой операции.", "bridge": "Финал маршрута — город с двумя судьбами: металлург и курорт."}, {"idx": "VIII", "name": "Липецк · финиш", "msg": "Липецк прошёл путь от петровских железоделательных заводов до одного из крупнейших металлургических центров страны — но у него есть и вторая, курортная жизнь: в 1805 году Александр I указом учредил курорт «Липецкие минеральные воды» прямо на месте старых заводов. Существует красивая легенда, что источники открыл сам Пётр I. В XIX веке сюда на сезон приезжала столичная знать — среди гостей была Анна Керн, адресат «Я помню чудное мгновенье». В 1871 году Липецк первым в России ввёл лечение торфяными ваннами. Так что после визита на НЛМК можно продолжить курортную традицию: бювет в Нижнем парке до сих пор работает.", "bridge": null}], "finale": "Вот и весь маршрут: от неорусской башни в Москве — до минеральных вод Липецка. По пути мы вспомнили Ивана III и Большую Засечную черту, проехали по следам самого успешного частного железнодорожного предприятия империи, увидели, как из станций вырастают города, и закончили в городе, где история петровских заводов соседствует с курортом столичной знаты. Неплохая география за семь часов в пути — добро пожаловать в Липецк!"};
let cur = 0;
const panel = document.getElementById('panel');
const counter = document.getElementById('counter');
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function render(i) {
  cur = i;
  const s = DATA.stations[i];
  panel.innerHTML =
    '<p class="p-title">' + esc(s.name) + '</p>' +
    '<p class="p-msg">' + esc(s.msg) + '</p>' +
    (s.bridge ? '<p class="p-bridge">' + esc(s.bridge) + '</p>' : '') +
    (i === DATA.stations.length - 1 ? '<p class="p-finale">' + esc(DATA.finale) + '</p>' : '');
  counter.textContent = (i + 1) + ' из ' + DATA.stations.length;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('sel', +n.dataset.i === i));
  document.getElementById('prev').style.opacity = i === 0 ? .4 : 1;
  document.getElementById('next').style.opacity = i === DATA.stations.length - 1 ? .4 : 1;
}
document.querySelectorAll('.node').forEach(n => n.addEventListener('click', () => render(+n.dataset.i)));
document.getElementById('prev').addEventListener('click', () => { if (cur > 0) render(cur - 1); });
document.getElementById('next').addEventListener('click', () => { if (cur < DATA.stations.length - 1) render(cur + 1); });
document.getElementById('copy').addEventListener('click', function() {
  const s = DATA.stations[cur];
  const text = s.msg + (s.bridge ? '\n\n' + s.bridge : '') + (cur === DATA.stations.length - 1 ? '\n\n' + DATA.finale : '');
  const done = () => { const b = this; b.textContent = 'Скопировано'; setTimeout(() => b.textContent = 'Скопировать сообщение', 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done).catch(fallback); }
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e) {} document.body.removeChild(ta); done(); }
});
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' && cur > 0) render(cur - 1); if (e.key === 'ArrowRight' && cur < DATA.stations.length - 1) render(cur + 1); });
render(0);
</script>
